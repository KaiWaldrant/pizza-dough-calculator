server {
    listen 8080;
    root /usr/share/nginx/html;
    # Don't advertise the nginx version in headers and error pages.
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite's hashed assets never change under the same name, so browsers may keep them for a year.
    # A missing asset is a real 404, not the app.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Always fetch index.html again, so a new deploy's asset names are picked up.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Any other path is an app link: serve the app, so refreshing on it works.
    location / {
        try_files $uri /index.html;
    }
}
